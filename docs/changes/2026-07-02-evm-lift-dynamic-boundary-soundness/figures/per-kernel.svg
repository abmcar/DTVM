<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 484" role="img" aria-label="Per-kernel steady-state execution-time change after removing the interpreter fallback" class="fig" width="100%">
  <style>
  .fig {
    --f-surface: #fcfcfb;
    --f-ink: #0b0b0b;
    --f-ink2: #52514e;
    --f-muted: #898781;
    --f-grid: #e1e0d9;
    --f-axis: #c3c2b7;
    --f-before: #898781;
    --f-after: #2a78d6;
    --f-ref: #1baf7a;
    --f-ctrl: #898781;
    --f-good: #006300;
    --f-warm: #e34948;
    --f-warmink: #b3201f;
    --f-fs: 13px;
  }
  @media (prefers-color-scheme: dark) {
    .fig {
      --f-surface: #1a1a19;
      --f-ink: #ffffff;
      --f-ink2: #c3c2b7;
      --f-muted: #898781;
      --f-grid: #2c2c2a;
      --f-axis: #383835;
      --f-before: #a8a7a1;
      --f-after: #3987e5;
      --f-ref: #199e70;
      --f-ctrl: #a8a7a1;
      --f-good: #0ca30c;
      --f-warm: #e66767;
      --f-warmink: #e66767;
    }
  }
  .fig text { font-family: system-ui,-apple-system,"Segoe UI",sans-serif; }
  .fig .tnum { font-variant-numeric: tabular-nums; }
  </style>
<rect x="0" y="0" width="720" height="484" fill="var(--f-surface)"/>
<text x="24" y="30" fill="var(--f-ink)" font-size="15.5" font-weight="600">Per-kernel steady-state execution-time change</text>
<text x="24" y="49" fill="var(--f-ink2)" font-size="12.5">recovered kernels (was interpreted → now JIT-compiled); negative = faster</text>
<rect x="24" y="63" width="13" height="11" rx="2" fill="var(--f-after)"/>
<text x="43" y="72" fill="var(--f-ink2)" font-size="12">faster (recovered)</text>
<rect x="189.0" y="63" width="13" height="11" rx="2" fill="var(--f-warm)"/>
<text x="208.0" y="72" fill="var(--f-ink2)" font-size="12">slower (regression)</text>
<rect x="361.0" y="63" width="13" height="11" rx="2" fill="var(--f-ctrl)"/>
<text x="380.0" y="72" fill="var(--f-ink2)" font-size="12">control (JIT both sides)</text>
<line x1="162.0" y1="92" x2="162.0" y2="426" stroke="var(--f-grid)" stroke-width="1"/>
<text x="162.0" y="444" fill="var(--f-muted)" font-size="11" text-anchor="middle" class="tnum">-100%</text>
<line x1="251.6" y1="92" x2="251.6" y2="426" stroke="var(--f-grid)" stroke-width="1"/>
<text x="251.6" y="444" fill="var(--f-muted)" font-size="11" text-anchor="middle" class="tnum">-75%</text>
<line x1="341.2" y1="92" x2="341.2" y2="426" stroke="var(--f-grid)" stroke-width="1"/>
<text x="341.2" y="444" fill="var(--f-muted)" font-size="11" text-anchor="middle" class="tnum">-50%</text>
<line x1="430.8" y1="92" x2="430.8" y2="426" stroke="var(--f-grid)" stroke-width="1"/>
<text x="430.8" y="444" fill="var(--f-muted)" font-size="11" text-anchor="middle" class="tnum">-25%</text>
<line x1="520.5" y1="92" x2="520.5" y2="426" stroke="var(--f-axis)" stroke-width="2"/>
<text x="520.5" y="444" fill="var(--f-ink2)" font-size="11" text-anchor="middle" class="tnum">0</text>
<line x1="610.1" y1="92" x2="610.1" y2="426" stroke="var(--f-grid)" stroke-width="1"/>
<text x="610.1" y="444" fill="var(--f-muted)" font-size="11" text-anchor="middle" class="tnum">+25%</text>
<text x="162" y="466" fill="var(--f-muted)" font-size="11.5">← faster</text>
<text x="628" y="466" fill="var(--f-muted)" font-size="11.5" text-anchor="end">slower →</text>
<text x="395.0" y="466" fill="var(--f-muted)" font-size="10.5" text-anchor="middle">Δ execution time vs base (%)</text>
<text x="24" y="113" fill="var(--f-muted)" font-size="11" font-weight="600" letter-spacing="0.03em">RECOVERED FROM INTERPRETER FALLBACK (was interpreted → now JIT)</text>
<line x1="24" y1="118" x2="696" y2="118" stroke="var(--f-grid)" stroke-width="1"/>
<text x="24" y="143.0" fill="var(--f-ink)" font-size="12.5" text-anchor="start">sha1_divs</text>
<rect x="187.1" y="131.0" width="333.4" height="16" fill="var(--f-after)"><title>sha1_divs: -93%</title></rect>
<text x="179.1" y="143.0" fill="var(--f-ink2)" font-size="11.5" font-weight="600" text-anchor="end" class="tnum">-93%</text>
<text x="24" y="177.0" fill="var(--f-ink)" font-size="12.5" text-anchor="start">sha1_shifts</text>
<rect x="194.3" y="165.0" width="326.2" height="16" fill="var(--f-after)"><title>sha1_shifts: -91%</title></rect>
<text x="186.3" y="177.0" fill="var(--f-ink2)" font-size="11.5" font-weight="600" text-anchor="end" class="tnum">-91%</text>
<text x="24" y="211.0" fill="var(--f-ink)" font-size="12.5" text-anchor="start">structarray_alloc</text>
<rect x="251.6" y="199.0" width="268.8" height="16" fill="var(--f-after)"><title>structarray_alloc: -75%</title></rect>
<text x="243.6" y="211.0" fill="var(--f-ink2)" font-size="11.5" font-weight="600" text-anchor="end" class="tnum">-75%</text>
<text x="24" y="245.0" fill="var(--f-ink)" font-size="12.5" text-anchor="start">blake2b_shifts</text>
<rect x="273.1" y="233.0" width="247.3" height="16" fill="var(--f-after)"><title>blake2b_shifts: -69%</title></rect>
<text x="265.1" y="245.0" fill="var(--f-ink2)" font-size="11.5" font-weight="600" text-anchor="end" class="tnum">-69%</text>
<text x="24" y="279.0" fill="var(--f-ink)" font-size="12.5" text-anchor="start">swap_math</text>
<rect x="344.8" y="267.0" width="175.6" height="16" fill="var(--f-after)"/>
<rect x="326.9" y="267.0" width="17.9" height="16" fill="var(--f-after)" fill-opacity="0.4"/>
<line x1="344.8" y1="266.0" x2="344.8" y2="284.0" stroke="var(--f-after)" stroke-width="2"/>
<line x1="326.9" y1="266.0" x2="326.9" y2="284.0" stroke="var(--f-after)" stroke-width="2"/>
<text x="318.9" y="279.0" fill="var(--f-ink2)" font-size="11.5" text-anchor="end" class="tnum">-49 to -54%</text>
<text x="24" y="313.0" fill="var(--f-ink)" font-size="12.5" text-anchor="start">snailtracer</text>
<rect x="384.2" y="301.0" width="136.2" height="16" fill="var(--f-after)"><title>snailtracer: -38%</title></rect>
<text x="376.2" y="313.0" fill="var(--f-ink2)" font-size="11.5" font-weight="600" text-anchor="end" class="tnum">-38%</text>
<text x="24" y="347.0" fill="var(--f-ink)" font-size="12.5" text-anchor="start">weierstrudel</text>
<rect x="520.5" y="335.0" width="68.1" height="16" fill="var(--f-warm)"/>
<rect x="588.6" y="335.0" width="10.8" height="16" fill="var(--f-warm)" fill-opacity="0.4"/>
<line x1="588.6" y1="334.0" x2="588.6" y2="352.0" stroke="var(--f-warm)" stroke-width="2"/>
<line x1="599.3" y1="334.0" x2="599.3" y2="352.0" stroke="var(--f-warm)" stroke-width="2"/>
<text x="607.3" y="347.0" fill="var(--f-ink2)" font-size="11.5" text-anchor="start" class="tnum">+19 to +22%</text>
<text x="24" y="377" fill="var(--f-muted)" font-size="11" font-weight="600" letter-spacing="0.03em">CONTROL — JIT ON BOTH SIDES (never in fallback population)</text>
<line x1="24" y1="382" x2="696" y2="382" stroke="var(--f-grid)" stroke-width="1"/>
<text x="24" y="407.0" fill="var(--f-ink2)" font-size="12.5" text-anchor="start">blake2b_huff</text>
<rect x="519.0" y="395.0" width="2.9" height="16" fill="var(--f-ctrl)" fill-opacity="0.55"/>
<text x="527.0" y="407.0" fill="var(--f-muted)" font-size="11.5" text-anchor="start" class="tnum">within ±0.4%</text>
</svg>