name: DTVM-EVM test CI in x86-64

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'resources/**'
      - '*.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'resources/**'
      - '*.md'
      - '.gitignore'
permissions:
    contents: read

# Shared FetchContent cache root for all container jobs. The hook in
# CMakeLists.txt (commit 96707a2 lines 8-18) picks this up as the base
# dir for FetchContent populations. Each container job adds an
# `actions/cache` step keyed on `hashFiles('third_party/AddDeps.cmake')`
# to persist this dir across CI runs.
env:
  FETCHCONTENT_BASE_DIR: /github/home/.fetchcontent

jobs:
  build_test_evm_interpreter_x86_ctest:
    name: Test DTVM-EVM interpreter with ctest on x86-64
    runs-on: ubuntu-latest
    container:
      image: dtvmdev1/dtvm-dev-x64:main
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: "true"
      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: /github/home/.fetchcontent
          key: ${{ runner.os }}-fc-${{ github.workflow }}-v1-${{ hashFiles('third_party/AddDeps.cmake') }}
      - name: Code Format Check
        run: |
          ./tools/format.sh check
      - name: Clone asmjit
        run: |
          git clone https://github.com/asmjit/asmjit.git
      - name: Build and Test
        run: |
          echo "current home is $HOME"
          export LLVM_SYS_150_PREFIX=/opt/llvm15
          export LLVM_DIR=$LLVM_SYS_150_PREFIX/lib/cmake/llvm
          export PATH=$LLVM_SYS_150_PREFIX/bin:$PATH
          export CMAKE_BUILD_TARGET=Debug
          export ENABLE_ASAN=true
          export RUN_MODE=interpreter
          export INPUT_FORMAT=evm
          export ENABLE_LAZY=true
          export ENABLE_MULTITHREAD=true
          export TestSuite=evmtestsuite
          export CPU_EXCEPTION_TYPE='check'
          export ENABLE_GAS_METER=false

          bash .ci/run_test_suite.sh

  build_test_release_multipass_lazy_evmtestsuite_on_x86_ctest:
    name: Test DTVM-EVM multipass in release mode with ctest on x86-64
    runs-on: ubuntu-latest
    container:
      image: dtvmdev1/dtvm-dev-x64:main
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: dtvm-ci-sccache-v1
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      DTVM_CI_USE_NINJA: "1"
      DTVM_CI_USE_SCCACHE: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          submodules: "true"
      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: /github/home/.fetchcontent
          key: ${{ runner.os }}-fc-${{ github.workflow }}-ninja-v1-${{ hashFiles('third_party/AddDeps.cmake') }}
      - name: Code Format Check
        run: |
          ./tools/format.sh check
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Build and Test
        run: |
          echo "current home is $HOME"
          export LLVM_SYS_150_PREFIX=/opt/llvm15
          export LLVM_DIR=$LLVM_SYS_150_PREFIX/lib/cmake/llvm
          export PATH=$LLVM_SYS_150_PREFIX/bin:$PATH
          echo "DTVM_CI_USE_NINJA=$DTVM_CI_USE_NINJA"
          echo "DTVM_CI_USE_SCCACHE=$DTVM_CI_USE_SCCACHE"
          echo "SCCACHE_GHA_VERSION=$SCCACHE_GHA_VERSION"
          echo "SCCACHE_BASEDIRS=$SCCACHE_BASEDIRS"
          which sccache
          sccache --version
          cmake --version
          ninja --version
          cc --version | head -n 1
          c++ --version | head -n 1
          export CMAKE_BUILD_TARGET=Release
          export ENABLE_ASAN=true
          export RUN_MODE=multipass
          export INPUT_FORMAT=evm
          export ENABLE_LAZY=false
          export ENABLE_MULTITHREAD=true
          export TestSuite=evmtestsuite
          export CPU_EXCEPTION_TYPE='check'
          export ENABLE_GAS_METER=true

          bash .ci/run_test_suite.sh
      - name: Print sccache stats
        if: always()
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            echo "sccache is not in PATH"
            exit 1
          fi
          sccache --show-stats
          sccache --show-stats --stats-format=json > /tmp/sccache-stats.json
          python3 - <<'PY'
          import json
          import numbers
          import sys

          with open("/tmp/sccache-stats.json", encoding="utf-8") as f:
              data = json.load(f)

          stats = data.get("stats", {})
          compile_requests = int(stats.get("compile_requests") or 0)

          def sum_numbers(value):
              if isinstance(value, bool):
                  return 0
              if isinstance(value, numbers.Number):
                  return int(value)
              if isinstance(value, dict):
                  return sum(sum_numbers(item) for item in value.values())
              if isinstance(value, list):
                  return sum(sum_numbers(item) for item in value)
              return 0

          cache_hits = sum_numbers(stats.get("cache_hits", {}).get("counts", {}))
          print(f"sccache compile_requests={compile_requests}")
          print(f"sccache aggregate_cache_hits={cache_hits}")

          if compile_requests <= 0:
              print("sccache did not observe compiler requests", file=sys.stderr)
              sys.exit(1)
          PY

